<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEMEGETON Rig V2</title>
<style>body{margin:0;background:#0d1012;color:#eee;font:12px system-ui;overflow:hidden}#ui{position:fixed;z-index:2;left:16px;top:16px;width:360px;padding:15px;background:#15191ddd;border:1px solid #343b40;border-radius:14px;backdrop-filter:blur(10px)}h1{font-size:17px;margin:0 0 3px;letter-spacing:.08em}.sub{font-size:10px;color:#99a4aa;margin-bottom:12px}button{background:#22282c;color:#eee;border:1px solid #41494e;border-radius:8px;padding:7px 9px;margin:2px;cursor:pointer}button:hover{border-color:#62ddff}label{display:block;margin-top:9px;color:#b8c0c5;font-size:10px}input{width:100%}.tag{display:inline-block;padding:3px 5px;border:1px solid #3c454b;border-radius:5px;margin:2px;font-size:9px}#st{position:fixed;right:15px;top:15px;background:#15191ddd;border:1px solid #343b40;padding:9px;border-radius:9px;font-size:10px}</style></head><body>
<div id="ui"><h1>LEMEGETON — RIG V2</h1><div class="sub">IK · PIVOTS · DOIGTS · TÊTE · VUE ÉCLATÉE</div>
<button id="a">ASSEMBLÉ</button><button id="e">ÉCLATÉ</button><button id="reset">CAMÉRA</button>
<label>Éclatement <b id="ev">0.00</b></label><input id="ex" type="range" min="0" max="1.8" step=".01" value="0">
<div style="margin-top:8px"><button data-b="HEAD">TÊTE</button><button data-b="SHOULDER_L">ÉPAULE L</button><button data-b="SHOULDER_R">ÉPAULE R</button><button data-b="WRIST_L">POIGNET L</button><button data-b="WRIST_R">POIGNET R</button></div>
<div><button data-b="FINGER1_L">L doigt 1</button><button data-b="FINGER2_L">L doigt 2</button><button data-b="FINGER3_L">L doigt 3</button><button data-b="THUMB_L">L pouce</button></div>
<div><button data-b="FINGER1_R">R doigt 1</button><button data-b="FINGER2_R">R doigt 2</button><button data-b="FINGER3_R">R doigt 3</button><button data-b="THUMB_R">R pouce</button></div>
<div><button id="wire">WIREFRAME</button><button id="spin">ROTATION</button></div>
<div style="margin-top:7px"><span class="tag">mechanical</span><span class="tag">IK architecture</span><span class="tag">3+1 fingers</span><span class="tag">exploded sync</span></div></div><div id="st">Chargement…</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const s=new T.Scene();s.background=new T.Color(0x0d1012);const c=new T.PerspectiveCamera(42,innerWidth/innerHeight,.01,100);c.position.set(3,1.7,3.4);const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(r.domElement);const o=new OrbitControls(c,r.domElement);o.enableDamping=true;o.target.set(0,1,0);s.add(new T.HemisphereLight(0xeaf6ff,0x202020,2.2));let l=new T.DirectionalLight(0xffffff,3);l.position.set(4,6,5);s.add(l);let model,bones=[],spin=false,wire=false,parts=[];
new GLTFLoader().load('./LEMEGETON_RIGGED_V2_BASE.glb',g=>{model=g.scene;let b=new T.Box3().setFromObject(model),cc=b.getCenter(new T.Vector3()),sz=b.getSize(new T.Vector3()),d=Math.max(sz.x,sz.y,sz.z);model.position.sub(cc);model.position.y+=d*.5;model.scale.setScalar(2.25/d);s.add(model);model.traverse(x=>{if(x.isBone)bones.push(x);if(x.isMesh)parts.push(x)});document.getElementById('st').innerHTML='✓ Skin + armature<br>V2 control inspection active'});
function ex(v){document.getElementById('ev').textContent=(+v).toFixed(2);if(!model)return;parts.forEach((m,i)=>{let p=m.position;p.x=(i%3-1)*v*.10;p.y=((i%5)-2)*v*.025})}
ex(0);document.getElementById('ex').oninput=e=>ex(e.target.value);e.onclick=()=>{ex(.8);ex.classList?.add('on')};a.onclick=()=>ex(0);reset.onclick=()=>{c.position.set(3,1.7,3.4);o.target.set(0,1,0);o.update()};wire.onclick=()=>{wire=!wire;parts.forEach(m=>(Array.isArray(m.material)?m.material:[m.material]).forEach(x=>x.wireframe=wire))};spin.onclick=()=>spin=!spin;
document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{let q=b.dataset.b,n=bones.find(x=>x.name===q);if(n)n.rotation.z+=(q.includes('_L')?.18:-.18)});
addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});let cl=new T.Clock();(function f(){requestAnimationFrame(f);let d=cl.getDelta();if(spin&&model)model.rotation.y+=d*.3;o.update();r.render(s,c)})();
</script></body></html>
